# Rate Limiting Zone Definitions (context: http)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

upstream backend_server {
    server backend:5000;
    keepalive 32;
}

# HTTP: Redirect all traffic to HTTPS (except Certbot verification requests)
server {
    listen 80;
    listen [::]:80;
    server_name
        niyantran.blackholeinfiverse.com
        gurukul.blackholeinfiverse.com
        samruddhi.blackholeinfiverse.com
        sampada.blackholeinfiverse.com
        artha.blackholeinfiverse.com
        uniguru.blackholeinfiverse.com
        vajra.blackholeinfiverse.com
        mitra.blackholeinfiverse.com
        annapoorna.blackholeinfiverse.com
        parikshak.blackholeinfiverse.com
        abhiruchi.blackholeinfiverse.com
        nagarvikas.blackholeinfiverse.com
        pravah.blackholeinfiverse.com
        pravesh.blackholeinfiverse.com
        parakosha.blackholeinfiverse.com
        hackaverse.blackholeinfiverse.com
        setu.blackholeinfiverse.com; # In production, replace with your domain (e.g. niyantran.yourdomain.com)

    # Certbot challenge validation endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Hardened Web and API routing proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name niyantran.blackholeinfiverse.com;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/niyantran.blackholeinfiverse.com/fullchain.pem;

    ssl_certificate_key /etc/letsencrypt/live/niyantran.blackholeinfiverse.com/privkey.pem;


    # Hardened TLS Protocols and Cipher Suites (Modern Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # SSL Session Optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "frame-ancestors http://localhost:3000 https://*.blackholeinfiverse.com" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static assets and UI routing to frontend container
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-running AI evaluation endpoint — extended timeout to prevent 504
    # Parikshak review calls are LLM-based and can take 60–120s; NGINX default is 60s.
    location ~ ^/api/submissions/[^/]+/evaluate-parikshak$ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routing with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=15 nodelay;
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoint with stricter rate limits
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Tunneling for Socket.IO
    location /socket.io/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running websocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

