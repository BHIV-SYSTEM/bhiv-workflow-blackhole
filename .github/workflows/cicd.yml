name: Production Infrastructure CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate production deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set GitHub SHA
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Generate Compose file for validation
        run: |
          sed "s|IMG_TAG|$short_sha|g" docker-compose.production.template.yml > docker-compose.production.yml

      - name: Create stub .env for compose validation
        run: |
          # Docker Compose config requires the env_file to exist to parse the schema.
          # We use a stub here — real secrets are injected at deploy time via GitHub secrets.
          cat <<EOF > .env
          MONGO_INITDB_ROOT_USERNAME=root
          MONGO_INITDB_ROOT_PASSWORD=stub_root_password
          MONGO_INITDB_DATABASE=blackhole_db
          MONGO_APP_USERNAME=niyantran_app
          MONGO_APP_PASSWORD=stub_app_password
          MONGODB_URI=mongodb://niyantran_app:stub_app_password@database:27017/blackhole_db?authSource=blackhole_db
          EOF

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.production.yml config

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            docker-compose.production.template.yml
            proxy configurations/nginx.conf
            proxy configurations/nginx.ssl.conf
            Monitoring/prometheus.yml
            Monitoring/datasource.yml
            mongo-init.js
            employee-agent/dist/Employee Activity Agent Setup 1.0.0.exe
            employee-agent/dist/Employee Activity Agent Setup 1.0.0.exe.blockmap

  build:
    name: Build production images
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker buildx build --push \
            --tag bhiv/niyantran-backend:${{ steps.vars.outputs.sha_short }} \
            --tag bhiv/niyantran-backend:latest \
            -f server/Dockerfile server

      - name: Build and push frontend image
        env:
          # Optional secret; defaults to current VM origin. Must stay aligned with FRONTEND_URL/CORS_ORIGIN.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_PRANA_BUCKET_URL: ${{ secrets.VITE_PRANA_BUCKET_URL }}
        run: |
          API_URL="${VITE_API_URL:-/api}"
          PRANA_BUCKET_URL="${VITE_PRANA_BUCKET_URL:-https://bhiv-bucket-i1l6.onrender.com/bucket/prana/ingest}"
          docker buildx build --push \
            --tag bhiv/niyantran-frontend:${{ steps.vars.outputs.sha_short }} \
            --tag bhiv/niyantran-frontend:latest \
            --build-arg VITE_API_URL="$API_URL" \
            --build-arg VITE_PRANA_BUCKET_URL="$PRANA_BUCKET_URL" \
            -f client/Dockerfile .

  deploy:
    name: Deploy to remote production VM via SSH
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifacts

      - name: Create .env file from secrets
        run: |
          cat <<'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF
      
      - name: Inject secrets into nginx config
        run: |
          export PRAVAH_API_KEY="${{ secrets.PRAVAH_API_KEY }}"
          envsubst '${PRAVAH_API_KEY}' \
            < "proxy configurations/nginx.ssl.conf" \
            > "proxy configurations/nginx.ssl.conf.tmp"
          mv "proxy configurations/nginx.ssl.conf.tmp" "proxy configurations/nginx.ssl.conf"

      - name: Tar deployment files
        run: |
          tar -czf deployment.tar.gz docker-compose.production.template.yml .env "proxy configurations" Monitoring mongo-init.js employee-agent

      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Create NIYANTRAN directory on VM
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "mkdir -p ~/NIYANTRAN"

      - name: Copy deployment tarball to VM
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" scp -P ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no deployment.tar.gz ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}:~/NIYANTRAN/deployment.tar.gz

      - name: Deploy production stack on VM
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/NIYANTRAN
            
            # Clean directory first, keeping docs folder (Release History) and the tarball we just copied
            find . -mindepth 1 ! -name docs ! -path './docs/*' ! -name deployment.tar.gz -exec rm -rf {} +
            
            # Extract deployment archive and clean up tarball
            tar -xzf deployment.tar.gz
            rm -f deployment.tar.gz
            
            # Confirm Docker availability
            docker version
            docker compose version
            
            # Log in to Docker Hub on the VM to authenticate for private pulls
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Restore persistent Release History
            mkdir -p docs
            if [ -f /var/tmp/NIYANTRAN/RELEASE_HISTORY.md ]; then
              cp /var/tmp/NIYANTRAN/RELEASE_HISTORY.md docs/RELEASE_HISTORY.md
            fi

            # V1 agent installer: the ~77 MB exe is gitignored and outside the
            # Docker build context, so it lives in a bind-mounted host dir that
            # survives this script's wipe of ~/NIYANTRAN (path is in /var/tmp).
            # Create it as the SSH user BEFORE compose runs (Docker would
            # otherwise create it root-owned, blocking future scp uploads).
            mkdir -p /var/tmp/NIYANTRAN/installers
            # The installer exe is tracked in git (see employee-agent/.gitignore)
            # and rides along in the deployment tarball — stage it into the
            # bind-mounted dir so no manual scp is ever required.
            if [ -f "employee-agent/dist/Employee Activity Agent Setup 1.0.0.exe" ]; then
              cp -f "employee-agent/dist/Employee Activity Agent Setup 1.0.0.exe" \
                /var/tmp/NIYANTRAN/installers/ \
                || echo "WARN: could not stage repo installer into /var/tmp/NIYANTRAN/installers"
            else
              echo "WARN: installer not present in deployment archive — Download will 404 until it is"
            fi
            # Optional override: set the AGENT_INSTALLER_URL repo secret to a
            # direct download link (GitHub Release asset / bucket object) and
            # every deploy re-fetches the installer. Never fails the deploy.
            if [ -n "${{ secrets.AGENT_INSTALLER_URL }}" ]; then
              if curl -fsSL --retry 3 --connect-timeout 15 \
                  -o /var/tmp/NIYANTRAN/installers/.installer.part \
                  "${{ secrets.AGENT_INSTALLER_URL }}"; then
                mv -f /var/tmp/NIYANTRAN/installers/.installer.part \
                  "/var/tmp/NIYANTRAN/installers/Employee Activity Agent Setup 1.0.0.exe" \
                  || echo "WARN: downloaded installer but could not place it"
              else
                echo "WARN: AGENT_INSTALLER_URL download failed — keeping any existing installer"
                rm -f /var/tmp/NIYANTRAN/installers/.installer.part
              fi
            fi
            
            # Generate target compose file from template by substituting the image tag
            sed "s|IMG_TAG|${{ needs.build.outputs.sha_short }}|g" docker-compose.production.template.yml > docker-compose.production.yml

            # Validate compose config before deploy
            docker compose -f docker-compose.production.yml config
            
            # Deploy production stack
            docker compose -f docker-compose.production.yml pull
            
            # Log out from Docker Hub to secure credentials on the VM
            docker logout

            docker compose -f docker-compose.production.yml up -d --remove-orphans
            
            # to Reload NGINX
            docker compose -f docker-compose.production.yml up -d --force-recreate proxy

            # Verify deployment status
            docker compose -f docker-compose.production.yml ps
            
            # Health Check - Check docker status (with compatibility fallback) and query frontend + backend endpoints
            echo "Waiting for services to be healthy..."
            for i in {1..12}; do
              # Fallback check for docker compose filter support
              if docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q >/dev/null 2>&1; then
                UNHEALTHY_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q | wc -l)
                STARTING_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=starting" -q | wc -l)
              else
                UNHEALTHY_COUNT=0
                STARTING_COUNT=0
              fi
              
              API_HEALTH=0
              curl -k -sf https://localhost/api/ping > /dev/null && API_HEALTH=1
              
              FRONTEND_HEALTH=0
              curl -k -sf https://localhost > /dev/null && FRONTEND_HEALTH=1
              
              if [ "$UNHEALTHY_COUNT" -eq 0 ] && [ "$STARTING_COUNT" -eq 0 ] && [ "$API_HEALTH" -eq 1 ] && [ "$FRONTEND_HEALTH" -eq 1 ]; then
                echo "All containers, API, and frontend endpoints are healthy!"
                break
              fi
              
              if [ "$i" -eq 12 ]; then
                echo "Health check failed!"
                docker compose -f docker-compose.production.yml ps
                docker compose -f docker-compose.production.yml logs --tail=50
                exit 1
              fi
              
              echo "Status: $STARTING_COUNT starting, $UNHEALTHY_COUNT unhealthy, api_ping=$API_HEALTH, frontend=$FRONTEND_HEALTH. Retrying in 10s..."
              sleep 10
            done
            
            # Prune old images while preserving recently built ones (last 7 days / 168 hours) to speed up rollbacks
            docker image prune -af --filter "until=168h"
          EOF

      - name: Update Release Documentation on Success
        if: success()
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/NIYANTRAN
            # Initialize release history file if not exists
            if [ ! -f docs/RELEASE_HISTORY.md ]; then
              mkdir -p docs
              echo "# Release History and Deployment Registry" > docs/RELEASE_HISTORY.md
              echo "" >> docs/RELEASE_HISTORY.md
              echo "| Timestamp | Image Tag (Git SHA) | Status | Description |" >> docs/RELEASE_HISTORY.md
              echo "|---|---|---|---|" >> docs/RELEASE_HISTORY.md
            fi
            
            # Log success
            echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | ${{ needs.build.outputs.sha_short }} | SUCCESS | Stable deployment |" >> docs/RELEASE_HISTORY.md
          EOF

      - name: Automatic Rollback on Failure
        if: failure()
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/NIYANTRAN
            
            echo "=== RECENT BACKEND CONTAINER LOGS ON DEPLOY FAILURE ==="
            docker compose -f docker-compose.production.yml logs --tail=60 backend || true
            
            # Robust parsing of Release History to extract the 7-character hexadecimal SHA column
            if [ -f docs/RELEASE_HISTORY.md ] && grep -qE "SUCCESS|ROLLBACK_SUCCESS" docs/RELEASE_HISTORY.md; then
              LAST_HEALTHY_TAG=$(grep -E "SUCCESS|ROLLBACK_SUCCESS" docs/RELEASE_HISTORY.md | tail -n 1 | awk -F '|' '{
                for(i=1; i<=NF; i++) {
                  gsub(/[[:space:]]/, "", $i);
                  if ($i ~ /^[0-9a-f]{7}$/) {
                    print $i;
                    exit;
                  }
                }
              }')
              
              if [ -z "$LAST_HEALTHY_TAG" ]; then
                echo "⚠️ No last healthy tag extracted from Release History. Cannot perform automatic rollback."
                exit 1
              fi
              
              echo "🚨 Deployment failed! Rolling back to last healthy tag: $LAST_HEALTHY_TAG"
              
              # Re-generate active compose file from original template with the healthy tag
              sed "s|IMG_TAG|$LAST_HEALTHY_TAG|g" docker-compose.production.template.yml > docker-compose.production.yml
              
              # Log in to Docker Hub on the VM to authenticate for rollback pulls
              echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
              
              # Pull last healthy tag
              docker compose -f docker-compose.production.yml pull
              
              # Log out from Docker Hub to secure credentials on the VM
              docker logout
              
              # Deploy last healthy tag
              docker compose -f docker-compose.production.yml up -d --remove-orphans
              
              # Verify deployment status
              docker compose -f docker-compose.production.yml ps
              
              # Log deployed image versions for easier troubleshooting
              docker compose -f docker-compose.production.yml images
              
              # Post-Rollback Verification (Run health check again)
              echo "Waiting for rollback services to be healthy..."
              for i in {1..12}; do
                if docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q >/dev/null 2>&1; then
                  UNHEALTHY_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q | wc -l)
                  STARTING_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=starting" -q | wc -l)
                else
                  UNHEALTHY_COUNT=0
                  STARTING_COUNT=0
                fi
                
                API_HEALTH=0
                curl -sf http://localhost/api/ping > /dev/null && API_HEALTH=1
                
                FRONTEND_HEALTH=0
                curl -sf http://localhost > /dev/null && FRONTEND_HEALTH=1
                
                if [ "$UNHEALTHY_COUNT" -eq 0 ] && [ "$STARTING_COUNT" -eq 0 ] && [ "$API_HEALTH" -eq 1 ] && [ "$FRONTEND_HEALTH" -eq 1 ]; then
                  echo "Rollback deployment is healthy!"
                  echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | $LAST_HEALTHY_TAG | ROLLBACK_SUCCESS | Rollback from failed ${{ needs.build.outputs.sha_short }} is healthy |" >> docs/RELEASE_HISTORY.md
                  exit 0
                fi
                
                if [ "$i" -eq 12 ]; then
                  echo "Rollback health check failed!"
                  echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | $LAST_HEALTHY_TAG | ROLLBACK_FAILED | Rollback from failed ${{ needs.build.outputs.sha_short }} failed health check |" >> docs/RELEASE_HISTORY.md
                  exit 1
                fi
                
                echo "Status: $STARTING_COUNT starting, $UNHEALTHY_COUNT unhealthy, api_ping=$API_HEALTH, frontend=$FRONTEND_HEALTH. Retrying in 10s..."
                sleep 10
              done
            else
              echo "⚠️ No last healthy tag found in Release History. Cannot perform automatic rollback."
              if [ ! -f docs/RELEASE_HISTORY.md ]; then
                mkdir -p docs
                echo "# Release History and Deployment Registry" > docs/RELEASE_HISTORY.md
                echo "" >> docs/RELEASE_HISTORY.md
                echo "| Timestamp | Image Tag (Git SHA) | Status | Description |" >> docs/RELEASE_HISTORY.md
                echo "|---|---|---|---|" >> docs/RELEASE_HISTORY.md
              fi
              echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | ${{ needs.build.outputs.sha_short }} | FAILED | Deployment failed and no rollback tag was available |" >> docs/RELEASE_HISTORY.md
              exit 1
            fi
          EOF

      - name: Save persistent Release History
        if: always()
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/NIYANTRAN
            if [ -f docs/RELEASE_HISTORY.md ]; then
              mkdir -p /var/tmp/NIYANTRAN
              cp docs/RELEASE_HISTORY.md /var/tmp/NIYANTRAN/RELEASE_HISTORY.md
            fi
          EOF
